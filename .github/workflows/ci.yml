name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pack:
    name: Skills, manifests, links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs

  example:
    name: Vanful example (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/vanful
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/vanful/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
